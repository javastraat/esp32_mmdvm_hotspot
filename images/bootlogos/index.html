<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMDVM Boot Logo Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 32px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 1.8em;
      color: #58a6ff;
      letter-spacing: 0.02em;
      margin-bottom: 10px;
    }
    header p {
      color: #8b949e;
      font-size: 0.92em;
      line-height: 1.6;
      max-width: 560px;
      margin: 0 auto;
    }
    header code {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.9em;
      color: #f0883e;
    }

    #status {
      text-align: center;
      color: #8b949e;
      font-size: 0.88em;
      margin-bottom: 28px;
      min-height: 1.4em;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .logo-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 300px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .logo-card:hover {
      border-color: #58a6ff;
      box-shadow: 0 0 0 1px #58a6ff40, 0 8px 24px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }

    .logo-preview {
      position: relative;
      width: 100%;
      cursor: pointer;
    }
    .logo-preview img {
      display: block;
      width: 100%;
      height: auto;
      /* Keep pixels sharp — these are 128×64 OLED bitmaps */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: 6px;
      border: 2px solid #30363d;
      background: #000;
      transition: border-color 0.2s;
    }
    .logo-preview:hover img { border-color: #58a6ff; }

    /* Overlay hint on hover */
    .logo-preview::after {
      content: '⬇ Download .bin';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(88, 166, 255, 0.18);
      color: #fff;
      font-size: 0.85em;
      font-weight: 600;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .logo-preview:hover::after { opacity: 1; }

    .logo-name {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      font-size: 0.82em;
      color: #8b949e;
      text-align: center;
      word-break: break-all;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      text-align: center;
      transition: background 0.15s, opacity 0.15s;
      display: inline-block;
      line-height: 1.4;
    }
    .btn-bin {
      background: #238636;
      color: #fff;
    }
    .btn-bin:hover { background: #2ea043; }
    .btn-png {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    .btn-png:hover { background: #30363d; }

    .empty {
      text-align: center;
      color: #8b949e;
      padding: 60px 20px;
      font-size: 0.95em;
    }
  </style>
</head>
<body>

  <header>
    <h1>🖥️ MMDVM Boot Logo Gallery</h1>
    <p>
      Click an image or <strong>Download .bin</strong> to save the binary file.<br>
      Rename it to <code>bootlogo.bin</code> and upload it to the <strong>root</strong> of the ESP32 internal flash (LittleFS) via the System Admin panel. Reboot to apply.
    </p>
  </header>

  <div id="status">Scanning for logos…</div>
  <div class="gallery" id="gallery"></div>

  <script>
    (function () {
      var gallery = document.getElementById('gallery');
      var status  = document.getElementById('status');

      // Probe this many sequential indices (1 … MAX).
      // Stops building cards for indices that have no PNG.
      var MAX = 50;

      var found   = [];   // { index, name } — filled when PNG loads
      var pending = MAX;  // countdown to zero

      function finish() {
        // Sort by index so cards always appear in order regardless of load timing
        found.sort(function (a, b) { return a.index - b.index; });

        if (found.length === 0) {
          gallery.innerHTML =
            '<div class="empty">No logos found in this folder.<br>' +
            'Add <code>bootlogo_1.png</code> + <code>bootlogo_1.bin</code> pairs here.</div>';
          status.textContent = 'No logos found.';
          return;
        }

        found.forEach(function (item) {
          var card = document.createElement('div');
          card.className = 'logo-card';

          card.innerHTML =
            '<div class="logo-preview" onclick="dlBin(\'' + item.name + '\')" title="Click to download ' + item.name + '.bin">' +
              '<img src="' + item.name + '.png" alt="' + item.name + '">' +
            '</div>' +
            '<div class="logo-name">' + item.name + '</div>' +
            '<div class="btn-row">' +
              '<button class="btn btn-bin" onclick="dlBin(\'' + item.name + '\')">&#8595; Download .bin</button>' +
              '<a href="' + item.name + '.png" download class="btn btn-png">&#8595; .png</a>' +
            '</div>';

          gallery.appendChild(card);
        });

        status.textContent =
          found.length + ' logo' + (found.length !== 1 ? 's' : '') + ' available.';
      }

      function tryLogo(i) {
        var name = 'bootlogo_' + i;
        var img  = new Image();
        img.src  = name + '.png';

        img.onload = function () {
          found.push({ index: i, name: name });
          pending--;
          if (pending === 0) finish();
        };

        img.onerror = function () {
          pending--;
          if (pending === 0) finish();
        };
      }

      for (var i = 1; i <= MAX; i++) tryLogo(i);
    })();

    // Trigger download of the .bin file for the given logo name
    function dlBin(name) {
      var a = document.createElement('a');
      a.href     = name + '.bin';
      a.download = name + '.bin';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>

</body>
</html>
